[package]
name = "godphoto-core"
description = "GodPhoto image model: layers, blend modes, adjustments, filters, files"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image.workspace = true
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
# Deflate through miniz_oxide: no C code.
zip = { version = "2", default-features = false, features = ["deflate"] }
