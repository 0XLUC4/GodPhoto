[package]
name = "godphoto"
description = "GodPhoto: pure-Rust photo editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "godphoto"
path = "src/main.rs"

[dependencies]
godphoto-core.workspace = true
image.workspace = true
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.35"
rfd = "0.17"
egui-phosphor = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
arboard = { version = "3", default-features = false, features = ["image-data"] }

[build-dependencies]
winresource = "0.1"
